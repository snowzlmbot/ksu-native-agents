name: Static and packaging checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev xz-utils shellcheck
      - run: make
      - run: python3 -m py_compile scripts/package.py
      - run: for f in module/common/*.sh module/common/agentctl module/common/termux module/common/native; do sh -n "$f"; done
      - run: python3 tests/release_regression.py
